version: '3.8'

services:
  app:
    build:
      context: ..
      dockerfile: deployment/Dockerfile
    container_name: khelsutra_app
    restart: unless-stopped
    ports:
      - "8000:80"
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: khelsutra
      DB_USERNAME: root
      DB_PASSWORD: rootpassword
    volumes:
      - ../backend:/var/www/html
    depends_on:
      - db

  db:
    image: mysql:8.4
    container_name: khelsutra_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: khelsutra
    ports:
      - "3306:3306"
    volumes:
      - dbdata:/var/lib/mysql
      - ../database/sports_management_database.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ../database/seeds/roles.sql:/docker-entrypoint-initdb.d/02_roles.sql
      - ../database/seeds/permissions.sql:/docker-entrypoint-initdb.d/03_permissions.sql
      - ../database/seeds/reference-data.sql:/docker-entrypoint-initdb.d/04_ref.sql

volumes:
  dbdata:
